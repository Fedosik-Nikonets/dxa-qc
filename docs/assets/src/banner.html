<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .b { position: relative; width: 1280px; height: var(--h, 400px); overflow: hidden; border-radius: 22px;
       font-family: "Inter", sans-serif; color: #f4ecff;
       background:
         radial-gradient(900px 420px at 88% 18%, rgba(232, 32, 140, .30), transparent 60%),
         radial-gradient(700px 460px at 62% 120%, rgba(120, 60, 255, .28), transparent 60%),
         linear-gradient(135deg, #0d0618 0%, #1a0b2e 45%, #2a0d44 100%); }
  .stars { position: absolute; inset: 0; }
  .txt { position: absolute; left: 64px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 720px; }
  .kicker { font: 600 15px/1 "Inter"; letter-spacing: .14em; text-transform: uppercase; color: #ff7cc4; margin-bottom: 22px; display: flex; gap: 12px; align-items: center; }
  .kicker i { width: 28px; height: 2px; background: #ff4fa8; display: inline-block; }
  h1 { margin: 0; font: 800 92px/0.95 "Inter Display", "Inter"; letter-spacing: -0.03em;
       background: linear-gradient(92deg, #ffffff 0%, #f3dcff 55%, #ff9fd6 100%); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 18px; font: 500 25px/1.3 "Inter"; color: #e2d4f5; max-width: 600px; }
  .chips { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font: 600 14px/1 "Inter"; padding: 9px 13px; border-radius: 999px; color: #f6ecff;
          background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); }
  .chip b { color: #ff8fcf; font-weight: 700; }
  .art { position: absolute; right: 14px; top: 0; height: 100%; }
  .team { position: absolute; right: 44px; bottom: 26px; font: 500 14px/1 "Inter"; color: rgba(236,222,255,.62); letter-spacing: .02em; }
  .team b { color: rgba(255,255,255,.88); font-weight: 600; }
</style></head>
<body>
<div class="b" id="b">
  <svg class="stars" width="1280" height="640" viewBox="0 0 1280 640" aria-hidden="true">
    <g fill="#fff">
      <circle cx="720" cy="40" r="1.2" opacity=".55"/><circle cx="1010" cy="92" r="1" opacity=".5"/>
      <circle cx="620" cy="340" r="1" opacity=".35"/><circle cx="1220" cy="300" r="1.4" opacity=".5"/>
      <circle cx="860" cy="372" r="1" opacity=".4"/><circle cx="560" cy="64" r="1.3" opacity=".45"/>
      <circle cx="1170" cy="40" r="1" opacity=".6"/><circle cx="690" cy="210" r="1.1" opacity=".35"/>
      <circle cx="1250" cy="160" r="1" opacity=".4"/><circle cx="930" cy="20" r="1.2" opacity=".5"/>
      <circle cx="600" cy="520" r="1.1" opacity=".4"/><circle cx="1100" cy="560" r="1.2" opacity=".45"/>
    </g>
  </svg>

  <div class="txt">
    <div class="kicker"><i></i>ЛЦТ 2026 · команда «Тёмная материя»</div>
    <h1>DXA QC</h1>
    <div class="sub">ИИ-сервис оценки качества рентгеновской денситометрии позвоночника и бедра</div>
    <div class="chips">
      <span class="chip">DICOM → вердикт за <b>0.1 с</b></span>
      <span class="chip"><b>5</b> проверок ТЗ 2.3</span>
      <span class="chip">объяснимые правила</span>
      <span class="chip">без сети и GPU</span>
    </div>
  </div>

  <!-- линия-арт: позвонки с измеренной осью и проксимальный отдел бедра -->
  <svg class="art" width="560" height="400" viewBox="0 0 560 400" aria-hidden="true">
    <defs>
      <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#d9c2ff" stop-opacity=".75"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <!-- позвоночник, наклонённый на 7° -->
    <g transform="translate(190 200) rotate(7) translate(-190 -200)" fill="none" stroke="url(#bone)" stroke-width="2.2">
      <rect x="148" y="34"  width="84" height="50" rx="12"/>
      <rect x="144" y="96"  width="92" height="52" rx="12"/>
      <rect x="140" y="160" width="100" height="54" rx="13"/>
      <rect x="136" y="226" width="108" height="56" rx="13"/>
      <rect x="132" y="294" width="116" height="58" rx="14"/>
      <g stroke-opacity=".45" stroke-width="1.6">
        <path d="M148 58 h-26 M232 58 h26 M144 121 h-28 M236 121 h28 M140 186 h-30 M240 186 h30 M136 253 h-32 M244 253 h32"/>
      </g>
    </g>
    <!-- вертикаль и измеренная ось -->
    <line x1="190" y1="14" x2="190" y2="386" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.4" stroke-dasharray="5 6"/>
    <line x1="214" y1="14" x2="166" y2="386" stroke="#ff4fa8" stroke-width="3" filter="url(#glow)"/>
    <g font-family="Inter" font-weight="700" font-size="15" fill="#ff8fcf">
      <text x="6" y="34">наклон 7.4° &gt; 4.5°</text>
    </g>

    <!-- бедро -->
    <g fill="none" stroke="url(#bone)" stroke-width="2.2" stroke-linejoin="round">
      <circle cx="388" cy="104" r="36"/>
      <path d="M420 88 C 444 98, 462 102, 478 98 C 496 94, 512 104, 514 124
               C 516 150, 500 176, 490 204 C 482 228, 478 262, 476 300 L 474 386"/>
      <path d="M378 138 C 388 156, 402 170, 410 188 C 416 204, 414 222, 410 236
               C 404 246, 404 256, 414 262 C 420 270, 418 300, 420 330 L 422 386"/>
    </g>
    <!-- медиальный край и точка малого вертела -->
    <path d="M422 386 L 420 330 C 418 300, 420 270, 414 262 C 404 256, 404 246, 410 236" fill="none" stroke="#5be3ff" stroke-width="2.4" filter="url(#glow)"/>
    <circle cx="407" cy="250" r="7" fill="none" stroke="#ff4fa8" stroke-width="2.6" filter="url(#glow)"/>
    <line x1="388" y1="250" x2="428" y2="250" stroke="#ffd166" stroke-width="1.8"/>
    <!-- рамка поля сканирования -->
    <rect x="336" y="40" width="200" height="346" rx="4" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.4" stroke-dasharray="4 5"/>
    <g font-family="Inter" font-weight="600" font-size="13" fill="#bfe9ff">
      <text x="300" y="290">малый вертел</text>
    </g>
  </svg>

</div>
</body></html>
