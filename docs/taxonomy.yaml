# Таксономия нарушений качества. Источник: ТЗ раздел 2.3 + столбцы файла разметка.xlsx.
# ВАЖНО: метки организатора выставлены на уровне «исследование × область»,
# пер-пиксельной и пер-точечной разметки в наборе нет.

regions:
  spine:
    ru: "Поясничный отдел позвоночника"
    code: "LUMBAR_SPINE"
  femur_left:
    ru: "Проксимальный отдел левого бедра"
    code: "LEFT_PROXIMAL_FEMUR"
  femur_right:
    ru: "Проксимальный отдел правого бедра"
    code: "RIGHT_PROXIMAL_FEMUR"

# Лейблы 1:1 со столбцами разметки. 0 — норма, 1 — нарушение.
labels:
  spine:
    - id: SPINE_POSITIONING
      column: "корректная укладка"
      ru: "Некорректная укладка: в кадр не попали верхние края подвздошных костей и/или половина тела Th12"
      tz: "2.3.1, рис.1"
    - id: SPINE_AXIS_TILT
      column: "правильно выравнена ось позвоночника (до 5)"
      ru: "Наклон оси позвоночника более 5°"
      tz: "2.3.1, рис.2"
    - id: SPINE_ARTIFACT
      column: "наличие посторонних предметов, выраженных артефактов или наложений"
      ru: "Инородные тела / металлические артефакты / наложения"
      tz: "2.3.1, рис.3"
  femur:
    - id: FEMUR_POSITIONING_ROTATION
      column: "позиционирование/ротация"
      ru: "Некорректное позиционирование или ротация (пере-/недоротация по малому вертелу)"
      tz: "2.3.2, рис.4, рис.5"
    - id: FEMUR_ROI_COVERAGE
      column: "корректности области интересов"
      ru: "Недостаточный охват области интереса (<3 см сверху/снизу, <2 см сбоку)"
      tz: "2.3.2, рис.6"

# Агрегаты организатора (столбцы «Итог»). Соответствуют quality_class в выходной таблице.
aggregate:
  rule: "OR по лейблам области"
  exceptions:
    - "3 исследования из 100 расходятся с OR: эксперт учитывал сколиоз и перелом,
       не входящие в перечень 2.3. См. reports/day1_findings.md."

# Дополнительные состояния, встреченные в комментариях эксперта, но не входящие
# в обязательный перечень 2.3.
#
# РЕШЕНИЕ (принято 17 сентября, согласовано обоими участниками):
# вводится флаг OUT_OF_SCOPE_FINDING. Он НЕ участвует в вычислении
# quality_class, но попадает в колонку violation_type отдельной пометкой.
#
# Обоснование 16-го: в трёх исследованиях из ста эксперт выставил «Итог»,
# расходящийся с OR по компонентам, именно из-за таких находок, и молча
# терять эту информацию нельзя.
#
# Обоснование, появившееся 17-го и сделавшее решение несущим. Сколиоз —
# главный источник ложных срабатываний правила «наклон оси» (6 из 10 ложных
# при пороге 4.5°, из них 4 прямо «сколиоз»). При этом из 20 позвоночников
# с находкой вне перечня 2.3 нарушением оси помечен ровно ОДИН: эксперт
# считает отклонение оси при сколиозе анатомией, а не ошибкой укладки.
# См. reports/day3_findings.md, раздел 7, и reports/out_of_scope_spine.csv.
#
# Отсюда два следствия, обязательных для обоих участников:
#
# 1. affects_quality_class: false — это не осторожность, а требование.
#    Если бы флаг влиял на quality_class, мы бы получили 14 ложных
#    срабатываний на сколиозе против одного совпадения с экспертом.
#
# 2. Метрический модуль считает метрики по ПОЛНОЙ выборке (это и есть
#    честная метрика решения), но дополнительно печатает ту же метрику по
#    подвыборке без исследований с находками вне 2.3 — как диагностику
#    источника ошибок для разбора 26 сентября и слайда по критерию 8.1.
#    Выкидывать эти исследования из основной метрики нельзя: на инференсе
#    их не выкинуть.
out_of_scope:
  - id: OUT_OF_SCOPE_FINDING
    ru: "Находка вне перечня 2.3, требует внимания врача"
    affects_quality_class: false
    reported_in: violation_type
    subtypes:
      - id: SCOLIOSIS
        ru: "Сколиоз"
        seen: 14          # 13 упоминаний + 1 «Сколиоз, не верная разметка»
      - id: HIP_ENDOPROSTHESIS
        ru: "Эндопротез тазобедренного сустава"
        seen: 2
        note: "Область с протезом организатором не размечена; в обучение не идёт,
               на инференсе обрабатывается как обычная (labeled=False)."
      - id: FRACTURE
        ru: "Перелом"
        seen: 1
      - id: LUMBARIZATION_L6
        ru: "Люмбализация L6"
        seen: 1

# Изображения без меток организатора. Возникают там, где область снята,
# но эксперт её не оценивал (все известные случаи — эндопротез).
# В таблице датасета помечены labeled=False и исключены из обучения и метрик.
unlabeled_images:
  count: 3
  studies: 2
